<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS Neraca Penatagunaan Tanah (Direct Attribute Mapper)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        #map { height: calc(100vh - 70px); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden">

    <header class="bg-gray-800 border-b border-gray-700 h-[70px] flex items-center justify-between px-4 md:px-6 shadow-lg z-50 relative">
        <div class="flex items-center space-x-3 md:space-x-4 pl-12 md:pl-0">
            <img src="logo-bpn.png" alt="Logo ATR/BPN" class="h-10 md:h-12 w-auto object-contain" onerror="this.src='https://via.placeholder.com/50?text=BPN'">
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-wide text-emerald-400 leading-tight">WEBGIS INTERAKTIF NPGT</h1>
                <p class="text-[10px] md:text-xs text-gray-400">Neraca Penatagunaan Tanah Kecamatan WP3WT</p>
            </div>
        </div>
        <div class="hidden sm:block text-xs bg-gray-700 px-3 py-1.5 rounded-md border border-gray-600 text-gray-300">
            Sistem Informasi Geografis v2.2 (Direct Attribute Mapper)
        </div>
    </header>

    <button id="menuBtn" class="fixed top-[15px] left-4 z-[100] bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-xl border border-emerald-500 shadow-xl flex items-center justify-center transition-all duration-300 focus:outline-none md:hidden">
        <svg id="menuIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <svg id="closeIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <div class="flex h-[calc(100vh-70px)] w-full relative">
        <aside id="sidebar" class="absolute md:relative top-0 left-0 h-full w-80 bg-gray-800/95 border-r border-gray-700 flex flex-col justify-between z-40 shadow-2xl transition-all duration-300 transform -translate-x-full md:translate-x-0">
            <div class="p-5 overflow-y-auto flex-1 mt-12 md:mt-0 space-y-6">
                <div>
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 flex items-center gap-2"><span></span> DATA SPASIAL</h2>
                    <p class="text-[11px] text-gray-500 mt-1">Menggunakan Atribut Asli KML/KMZ.</p>
                </div>

                <div class="space-y-2.5">
                    <div id="layerControls" class="space-y-2">
                        <!-- Layer Mapping -->
                    </div>
                </div>

                <div class="border-t border-gray-700/60 pt-4">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3 flex items-center gap-1.5"><span></span> KELAS ATRIBUT AKTIF</h3>
                    <div id="dynamicLegend" class="text-xs space-y-4 text-gray-300 bg-gray-900/50 p-3 rounded-xl border border-gray-700/40 max-h-[240px] overflow-y-auto">
                        <p class="text-gray-500 italic">Aktifkan layer untuk melihat data.</p>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-gray-950 border-t border-gray-700 text-center text-xs text-gray-500">KANWIL BPN PROVINSI GORONTALO © 2026</div>
        </aside>

        <main id="map" class="flex-1 z-10 w-full"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

    <script>
        const layersConfig = [
            { id: 'layer1', label: 'Penggunaan Tanah', field: 'PENGGUNAAN' },
            { id: 'layer2', label: 'Ketersediaan Tanah', field: 'KETERSEDIAAN' },
            { id: 'layer3', label: 'Kesesuaian Rencana Pola Ruang', field: 'KSPOLA' },
            { id: 'layer4', label: 'Tekstur Tanah', field: 'TEKSTUR' },
            { id: 'layer5', label: 'Kedalaman Efektif', field: 'KDEFEK' },
            { id: 'layer6', label: 'Tingkat Erosi', field: 'EROSI' },
            { id: 'layer7', label: 'Tingkat Drainase', field: 'DRAINS' }
        ];

        const map = L.map('map', { zoomControl: false }).setView([0.5435, 121.9324], 11);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

        const paletWarna = ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#808080'];
        
        const loadedLayers = {};
        const activeLayers = {};
        const layerLegendData = {};

        // Buat Control UI
        const container = document.getElementById('layerControls');
        layersConfig.forEach(l => {
            container.innerHTML += `
                <div class="flex items-center justify-between p-3 bg-gray-700/40 hover:bg-gray-700 border border-gray-700/60 rounded-xl transition">
                    <label for="${l.id}" class="text-sm font-medium flex-1 cursor-pointer">${l.label}</label>
                    <input type="checkbox" id="${l.id}" class="w-4 h-4 text-emerald-500 rounded bg-gray-600 border-gray-500 cursor-pointer">
                </div>
            `;
        });

        function getValFromFeature(feature, targetField) {
            const props = feature.properties;
            for (let key in props) {
                if (key.toLowerCase() === targetField.toLowerCase()) return String(props[key]);
            }
            // Fallback searching if explicit field not found
            for (let key in props) {
                if (key.toLowerCase().includes(targetField.toLowerCase())) return String(props[key]);
            }
            return "Tidak Ada Data";
        }

        async function muatKmz(config) {
            try {
                const response = await fetch(`data/${config.id}.kmz`);
                const blob = await response.blob();
                const zip = await JSZip.loadAsync(blob);
                const kmlText = await zip.files[Object.keys(zip.files)[0]].async("string");
                const layer = omnivore.kml.parse(kmlText);
                
                layer.on('ready', function() {
                    let uniqueValues = {};
                    layer.eachLayer(function(subLayer) {
                        let val = getValFromFeature(subLayer.feature, config.field);
                        if (!uniqueValues[val]) {
                            uniqueValues[val] = paletWarna[Object.keys(uniqueValues).length % paletWarna.length];
                        }
                        subLayer.setStyle({ fillColor: uniqueValues[val], color: '#ffffff', weight: 1, fillOpacity: 0.8 });
                        subLayer.bindPopup(`<b>${config.label}</b><br>${config.field}: ${val}`);
                    });
                    layerLegendData[config.id] = uniqueValues;
                });

                document.getElementById(config.id).addEventListener('change', function(e) {
                    if (e.target.checked) {
                        layer.addTo(map);
                        activeLayers[config.id] = true;
                        map.fitBounds(layer.getBounds());
                    } else {
                        map.removeLayer(layer);
                        activeLayers[config.id] = false;
                    }
                    renderLegend();
                });
            } catch(e) { console.error("Error loading " + config.id); }
        }

        function renderLegend() {
            const container = document.getElementById('dynamicLegend');
            container.innerHTML = '';
            let active = false;
            layersConfig.forEach(l => {
                if(activeLayers[l.id] && layerLegendData[l.id]) {
                    active = true;
                    let html = `<div class='mb-4'><p class='font-bold text-emerald-400 border-b border-gray-700'>${l.label}</p>`;
                    for(let val in layerLegendData[l.id]) {
                        html += `<div class='flex items-center gap-2 mt-1'><span class='w-3 h-3 rounded' style='background:${layerLegendData[l.id][val]}'></span>${val}</div>`;
                    }
                    container.innerHTML += html + '</div>';
                }
            });
            if(!active) container.innerHTML = '<p class="text-gray-500 italic">Pilih layer untuk melihat legenda.</p>';
        }

        layersConfig.forEach(muatKmz);
    </script>
</body>
</html>
