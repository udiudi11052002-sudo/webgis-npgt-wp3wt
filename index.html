<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS Neraca Penatagunaan Tanah (Robust KMZ Parser)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        #map { height: calc(100vh - 70px); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden">

    <header class="bg-gray-800 border-b border-gray-700 h-[70px] flex items-center justify-between px-4 md:px-6 shadow-lg z-50 relative">
        <div class="flex items-center space-x-3 md:space-x-4 pl-12 md:pl-0">
            <img src="logo-bpn.png" alt="Logo ATR/BPN" class="h-10 md:h-12 w-auto object-contain" onerror="this.src='https://via.placeholder.com/50?text=BPN'">
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-wide text-emerald-400 leading-tight">WEBGIS INTERAKTIF NPGT</h1>
                <p class="text-[10px] md:text-xs text-gray-400">Neraca Penatagunaan Tanah Kecamatan WP3WT</p>
            </div>
        </div>
        <div class="hidden sm:block text-xs bg-gray-700 px-3 py-1.5 rounded-md border border-gray-600 text-gray-300">
            Sistem Informasi Geografis v2.5 (Robust Parser)
        </div>
    </header>

    <button id="menuBtn" class="fixed top-[15px] left-4 z-[100] bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-xl border border-emerald-500 shadow-xl flex items-center justify-center transition-all duration-300 focus:outline-none md:hidden">
        <svg id="menuIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <svg id="closeIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <div class="flex h-[calc(100vh-70px)] w-full relative">
        <aside id="sidebar" class="absolute md:relative top-0 left-0 h-full w-80 bg-gray-800/95 border-r border-gray-700 flex flex-col justify-between z-40 shadow-2xl transition-all duration-300 transform -translate-x-full md:translate-x-0">
            <div class="p-5 overflow-y-auto flex-1 mt-12 md:mt-0 space-y-6">
                <div>
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 flex items-center gap-2"><span></span> DATA SPASIAL</h2>
                    <p class="text-[11px] text-gray-500 mt-1">Sistem Render Peta Terpadu.</p>
                </div>

                <div class="space-y-2.5" id="layerControls">
                    <!-- Dynamic Layer Toggles -->
                </div>

                <div class="border-t border-gray-700/60 pt-4">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3 flex items-center gap-1.5"><span></span> KELAS ATRIBUT AKTIF</h3>
                    <div id="dynamicLegend" class="text-xs space-y-4 text-gray-300 bg-gray-900/50 p-3 rounded-xl border border-gray-700/40 max-h-[240px] overflow-y-auto">
                        <p class="text-gray-500 italic">Aktifkan layer untuk melihat legenda.</p>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-gray-950 border-t border-gray-700 text-center text-xs text-gray-500">KANWIL BPN PROVINSI GORONTALO © 2026</div>
        </aside>

        <main id="map" class="flex-1 z-10 w-full"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

    <script>
        const layersConfig = [
            { id: 'kedalaman_efektif', label: 'Kedalaman Efektif', field: 'KDEFEK' },
            { id: 'kesesuaian_rtrw', label: 'Kesesuaian Rencana Pola Ruang', field: 'KSPOLA' },
            { id: 'ketersediaan_tanah', label: 'Ketersediaan Tanah', field: 'KETERSEDIAAN' },
            { id: 'penggunaan_tanah', label: 'Penggunaan Tanah', field: 'PENGGUNAAN' },
            { id: 'tekstur_tanah', label: 'Tekstur Tanah', field: 'TEKSTUR' },
            { id: 'tingkat_drainase', label: 'Tingkat Drainase', field: 'DRAINS' },
            { id: 'tingkat_erosi', label: 'Tingkat Erosi', field: 'EROSI' }
        ];

        const map = L.map('map', { zoomControl: false }).setView([0.5435, 121.9324], 11);
        L.control.zoom({ position: 'topright' }).addTo(map);

        const basemaps = {
            Satelit: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }),
            PetaJalan: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{y}/{x}.png', { attribution: 'OSM' })
        };
        basemaps.Satelit.addTo(map);
        L.control.layers(basemaps, null, { position: 'bottomright' }).addTo(map);

        const loadedLayers = {};
        const activeLayers = {};
        const layerLegends = {};

        const controlContainer = document.getElementById('layerControls');
        layersConfig.forEach(cfg => {
            controlContainer.innerHTML += `
                <div class="flex items-center justify-between p-3 bg-gray-700/40 hover:bg-gray-700 border border-gray-700/60 rounded-xl transition">
                    <label for="${cfg.id}" class="text-sm font-medium flex-1 cursor-pointer">${cfg.label}</label>
                    <div class="flex items-center gap-3">
                        <a href="data/${cfg.id}.kmz" download="${cfg.id}.kmz" title="Download KMZ" class="text-gray-400 hover:text-emerald-400 transition-colors z-10">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </a>
                        <input type="checkbox" id="${cfg.id}" class="w-4 h-4 text-emerald-500 rounded bg-gray-600 border-gray-500 cursor-pointer">
                    </div>
                </div>
            `;
        });

        function kmlColorToCss(kmlColor) {
            if (!kmlColor || kmlColor.length !== 8) return { color: '#3388ff', opacity: 0.7 };
            let aHex = kmlColor.substring(0, 2);
            let bHex = kmlColor.substring(2, 4);
            let gHex = kmlColor.substring(4, 6);
            let rHex = kmlColor.substring(6, 8);
            
            let alpha = parseInt(aHex, 16) / 255;
            if (isNaN(alpha)) alpha = 0.7;
            let hexColor = `#${rHex}${gHex}${bHex}`;
            return { color: hexColor, opacity: alpha };
        }

        const paletWarna = ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#808080'];

        async function initLayer(cfg) {
            try {
                const response = await fetch(`data/${cfg.id}.kmz`);
                const blob = await response.blob();
                const zip = await JSZip.loadAsync(blob);
                const kmlFileName = Object.keys(zip.files).find(name => name.toLowerCase().endsWith('.kml'));
                if (!kmlFileName) return;
                
                const kmlText = await zip.files[kmlFileName].async("string");
                const parser = new DOMParser();
                const kmlDoc = parser.parseFromString(kmlText, "text/xml");

                // Parse KML Styles
                const styleMap = {};
                const styles = kmlDoc.getElementsByTagName('Style');
                for (let s of styles) {
                    let id = s.getAttribute('id');
                    let polyStyle = s.getElementsByTagName('PolyStyle')[0];
                    let lineStyle = s.getElementsByTagName('LineStyle')[0];
                    
                    let fillStyle = { color: '', opacity: 0.7 };
                    let strokeStyle = { color: '#ffffff', opacity: 1 };
                    let weight = 1;

                    if (polyStyle) {
                        let cElem = polyStyle.getElementsByTagName('color')[0];
                        if (cElem) fillStyle = kmlColorToCss(cElem.textContent.trim());
                    }
                    if (lineStyle) {
                        let cElem = lineStyle.getElementsByTagName('color')[0];
                        let wElem = lineStyle.getElementsByTagName('width')[0];
                        if (cElem) strokeStyle = kmlColorToCss(cElem.textContent.trim());
                        if (wElem) weight = parseFloat(wElem.textContent) || 1;
                    }

                    styleMap[id] = {
                        fillColor: fillStyle.color,
                        fillOpacity: fillStyle.opacity,
                        color: strokeStyle.color,
                        weight: weight
                    };
                }

                const geoLayer = omnivore.kml.parse(kmlDoc, null, L.geoJson(null, {
                    style: function(feature) {
                        let sUrl = feature.properties.styleUrl;
                        if (sUrl) {
                            let cleanId = sUrl.replace('#', '');
                            if (styleMap[cleanId] && styleMap[cleanId].fillColor) {
                                return styleMap[cleanId];
                            }
                        }
                        return { fillColor: '#3388ff', fillOpacity: 0.7, color: '#ffffff', weight: 1 };
                    },
                    onEachFeature: function(feature, layer) {
                        let p = feature.properties;
                        let content = `<div class='text-gray-900 font-sans p-1'><h3 class='font-bold border-b pb-1 mb-2 text-emerald-700 text-sm'>ℹ️ ${cfg.label}</h3><table class='text-xs w-full'>`;
                        
                        for (let k in p) {
                            if (!['styleUrl', 'styleHash', 'id', 'fill', 'stroke', 'visibility', 'tessellate', 'extrude'].includes(k)) {
                                let val = p[k] || "-";
                                content += `<tr><td class='font-semibold pr-3 py-0.5 text-gray-600 uppercase'>${k}</td><td class='text-gray-800'>: ${val}</td></tr>`;
                            }
                        }
                        content += "</table></div>";
                        layer.bindPopup(content);
                    }
                }));

                // Fallback otomatis jika style KML kosong/tidak terbaca
                let colorIndex = 0;
                const legendItems = {};
                geoLayer.eachLayer(function(subLayer) {
                    let p = subLayer.feature.properties;
                    let val = "";
                    for (let k in p) {
                        if (k.toLowerCase() === cfg.field.toLowerCase()) {
                            val = String(p[k]);
                            break;
                        }
                    }
                    if (!val) {
                        // Ambil field pertama yang valid
                        for (let k in p) {
                            if (!['styleUrl', 'styleHash', 'id', 'fill', 'stroke'].includes(k) && p[k]) {
                                val = String(p[k]);
                                break;
                            }
                        }
                    }
                    if (!val) val = "Area Utama";

                    let sUrl = subLayer.feature.properties.styleUrl;
                    let appliedColor = '';
                    if (sUrl && styleMap[sUrl.replace('#', '')] && styleMap[sUrl.replace('#', '')].fillColor) {
                        appliedColor = styleMap[sUrl.replace('#', '')].fillColor;
                    }

                    if (!legendItems[val]) {
                        if (!appliedColor) {
                            appliedColor = paletWarna[colorIndex % paletWarna.length];
                            colorIndex++;
                        }
                        legendItems[val] = appliedColor;
                    }

                    // Pastikan poligon diberi warna jika style asli tidak ada
                    if (!appliedColor) {
                        appliedColor = legendItems[val];
                    }
                    
                    if (typeof subLayer.setStyle === 'function') {
                        subLayer.setStyle({ fillColor: appliedColor, fillOpacity: 0.75, color: '#ffffff', weight: 1 });
                    }
                });

                layerLegends[cfg.id] = legendItems;
                loadedLayers[cfg.id] = geoLayer;

                document.getElementById(cfg.id).addEventListener('change', function(e) {
                    if (e.target.checked) {
                        geoLayer.addTo(map);
                        try { map.fitBounds(geoLayer.getBounds()); } catch(err){}
                        activeLayers[cfg.id] = true;
                        if (window.innerWidth < 768) sidebar.classList.add('-translate-x-full');
                    } else {
                        map.removeLayer(geoLayer);
                        activeLayers[cfg.id] = false;
                    }
                    renderLegendBox();
                });

            } catch (err) {
                console.error("Gagal memuat layer " + cfg.id, err);
            }
        }

        function renderLegendBox() {
            const container = document.getElementById('dynamicLegend');
            container.innerHTML = '';
            let activeCount = 0;

            layersConfig.forEach(cfg => {
                if (activeLayers[cfg.id] && layerLegends[cfg.id]) {
                    activeCount++;
                    let html = `<div class='mb-3'><p class='font-bold text-emerald-400 border-b border-gray-700 pb-0.5 mb-1.5'>${cfg.label}</p><div class='space-y-1.5'>`;
                    
                    for (let val in layerLegends[cfg.id]) {
                        let col = layerLegends[cfg.id][val];
                        html += `<div class='flex items-center gap-2'>
                                    <span class='w-3.5 h-3.5 rounded-sm border border-white/30 inline-block shadow-sm' style='background-color:${col}'></span>
                                    <span class='capitalize leading-tight'>${val}</span>
                                 </div>`;
                    }
                    html += `</div></div>`;
                    container.innerHTML += html;
                }
            });

            if (activeCount === 0) {
                container.innerHTML = '<p class="text-gray-500 italic">Aktifkan layer untuk melihat legenda.</p>';
            }
        }

        layersConfig.forEach(initLayer);
    </script>
</body>
</html>
